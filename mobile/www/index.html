/* ============ Code 39 barcode (SVG) ============ */
const C39={"0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw","5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn","*":"nwnnwnwnn"};
function barcodeSVG(code){
  const chars=("*"+code+"*").split(""); let x=10; const N=2,W=5,H=60; let rects="";
  chars.forEach((ch,ci)=>{
    const p=C39[ch]; if(!p) return;
    for(let i=0;i<9;i++){ const w=p[i]==="w"?W:N; if(i%2===0) rects+=`<rect x="${x}" y="0" width="${w}" height="${H}"/>`; x+=w; }
    if(ci<chars.length-1) x+=N;
  });
  return `<svg viewBox="0 0 ${x+10} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

/* --- دورة الفترة: كل الأقسام التي عندها حصة في نفس الفترة --- */
let roundPid=null;
function roundWins(date){ const m={}; slotsOn(date).forEach(x=>{ m[x.from+"|"+x.to]=1; }); return Object.keys(m).sort(); }
function currentWin(){ const now=hmMin(nowHM()); return roundWins(todayStr()).find(w=>{ const [f,t]=w.split("|"); return now>=hmMin(f)-10&&now<hmMin(t); })||null; }
function roundSlotsW(w){ if(!w) return []; const [f,t]=w.split("|"); return slotsOn(todayStr()).filter(x=>x.from===f&&x.to===t).sort((a,b)=>cls(a.classId).name.localeCompare(cls(b.classId).name,"ar",{numeric:true})); }
function nextInRound(se){
  if(se.date!==todayStr()) return null;
  return roundSlotsW(se.from+"|"+se.to).find(x=>!isSaved(x.sid)&&x.sid!==se.id)||null;
}
function roundSummary(){
  const w=currentWin(); if(!w) return ""; const sl=roundSlotsW(w); if(!sl.length) return "";
  const done=sl.filter(x=>isSaved(x.sid)).length; const [f,t]=w.split("|");
  return `<div class="card roundcard" onclick="roundPid=null;view='round';render()"><div><b>⏱️ الفترة الحالية ${f}–${t}</b><div class="muted">${done} من ${sl.length} قسم سُجّل</div></div>
    <div class="prog"><i style="width:${Math.round(done*100/sl.length)}%"></i></div><span class="btn sm">دورة الفترة ←</span></div>`;
}

function vRound(){
  const wins=roundWins(todayStr()), cw=currentWin(); const w=(roundPid&&wins.includes(roundPid))?roundPid:cw||wins[0]||null;
  const sl=roundSlotsW(w), d=new Date().getDay(), ids=sl.map(x=>x.sid);
  const abs=S.absences.filter(a=>ids.includes(a.sessionId)), held=abs.filter(a=>a.status==="hold"), done=sl.filter(x=>isSaved(x.sid)).length;
  return `<div class="card"><h2>دورة الفترة — ${DAY_NAMES[d]} ${fmtDate(todayStr())}</h2>
    ${calBanner(todayStr())}
    <div class="segs">${wins.map(x=>{ const [f,t]=x.split("|"); return `<button class="${x===w?"on":""}" onclick="roundPid='${x}';render()">${f}–${t}${x===cw?" ●":""}</button>`; }).join("")}</div>
    ${w?`<div class="prog" style="margin-top:10px"><i style="width:${sl.length?Math.round(done*100/sl.length):0}%"></i></div><p class="muted" style="margin:6px 0 0">${done} من ${sl.length} قسم سُجّل · ${abs.length} غائب في هذه الفترة</p>`:""}</div>
    ${flashHTML()}
    ${sl.length?sl.map(x=>{ const se=getSess(x.sid), n=S.absences.filter(a=>a.sessionId===x.sid).length;
      return `<button class="dslot ${se&&se.savedAt?"done":""}" onclick="openSlot('${x.key}')">
        <span class="dt">${se&&se.savedAt?"✅":"⏳"}</span>
        <span class="dm"><b>${esc(cls(x.classId).name)}</b><span>${esc(x.subject)} · ${x.teacher?esc(x.teacher):"—"}</span></span>
        <span class="ds">${se&&se.savedAt?`<span class="tag ${n?"red":"ok"}">${n} غائب</span>`:'<span class="tag amb">لم يُسجّل</span>'}</span></button>`; }).join("")
      :`<div class="card empty">لا توجد حصص اليوم${calOn(todayStr())&&calOn(todayStr()).type==="holiday"?" (عطلة)":""}.</div>`}
    <div class="card"><h2>إرسال الرسائل للأولياء</h2>
      ${held.length?`<p>${held.length} رسالة جاهزة بانتظار الإرسال: ${held.map(a=>esc(a.studentName)).join("، ")}</p>
        <button class="btn big" onclick="releaseHeld(a=>${JSON.stringify(ids).replace(/"/g,"&quot;")}.includes(a.sessionId))">📨 إرسال الرسائل للأولياء (${held.length})</button>`
      :`<p class="muted" style="margin:0">${S.cfg.sendMode==="manual"?"لا توجد رسائل بانتظار الإرسال في هذه الفترة.":"الإرسال آلي: تُرسل الرسائل وحدها بعد الحفظ ومرور "+S.cfg.delayMin+" دقيقة. المتابعة في «الإشعارات»."}</p>`}
    </div>`;
}
function releaseHeld(pred){
  const now=Date.now(); let n=0;
  S.absences.forEach(a=>{ if(a.status==="hold"&&pred(a)){ a.status="waiting"; a.notifyAt=now; n++; } });
  saveLocal(); toast(autoOn()?`📨 بدأ إرسال ${n} رسالة من شريحة الجهاز`:`${n} رسالة جاهزة — أرسلها من «الإشعارات»`); autoSendTick().catch(()=>{});
}
function recentSessions(){
  const seen={}; const rows=[];
  S.absences.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(a=>{
    if(!seen[a.sessionId]){seen[a.sessionId]={a,n:0};rows.push(seen[a.sessionId])} seen[a.sessionId].n++;
  });
  if(!rows.length) return "";
  return `<div class="card"><h2>آخر الحصص المسجّلة</h2><table><tr><th>الحصة</th><th>القسم</th><th>التاريخ</th><th>الغيابات</th></tr>
    ${rows.slice(0,8).map(r=>`<tr><td>${esc(r.a.subject)}</td><td>${esc((cls(r.a.classId)||{}).name||r.a.className||"")}</td><td>${fmtDate(r.a.date)} ${r.a.from}</td><td><span class="tag red">${r.n}</span></td></tr>`).join("")}
  </table></div>`;
}
function startSession(){
  const g=id=>document.getElementById(id).value.trim();
  if(!g("sSubject")||!g("sTeacher")) return toast("أدخل المادة واسم الأستاذ",true);
  session={id:uid(),classId:g("sClass"),subject:g("sSubject"),teacher:g("sTeacher"),date:g("sDate"),from:g("sFrom"),to:g("sTo")};

}

function toggleAbs(studentId){
  const id=session.id+"_"+studentId;

  if(ex){ if(ex.status==="sent") return toast("أُرسل الإشعار للولي، لا يمكن إلغاء هذا الغياب",true); del("absences",id); return; }
  const st=S.students.find(s=>s.id===studentId); const c=cls(session.classId);
  const now=Date.now();
  put("absences",{id,sessionId:session.id,studentId,studentName:st.name,code:st.code,classId:session.classId,className:c?c.name:"",
    subject:session.subject,teacher:session.teacher,date:session.date,from:session.from,to:session.to,
    createdAt:now,notifyAt:now+(Number(S.cfg.delayMin)||0)*60000,status:"waiting"});
}
function scanCode(v){
  v=String(v||"").replace(/\*/g,"").trim(); if(!v) return;
  const st=stuByCode(v);
  if(!st) return toast("الرقم "+v+" غير موجود",true);
  if(st.classId!==session.classId) return toast(st.name+" ليس من هذا القسم",true);
  const id=session.id+"_"+st.id;
  if(S.absences.find(a=>a.id===id)) return toast(st.name+" مسجّل غائباً من قبل",false);
  toggleAbs(st.id); toast("✓ سُجّل غياب "+st.name);
}
async function scanImage(inp){
  const f=inp.files&&inp.files[0]; inp.value=""; if(!f) return;
  if(!("BarcodeDetector" in window)) return toast("هذا المتصفح لا يقرأ الكودبار من الصور. استعمل قارئ كودبار أو اكتب الرقم.",true);
  try{
    const bmp=await createImageBitmap(f);
    const det=new BarcodeDetector({formats:["code_39","code_128","qr_code"]});
    const r=await det.detect(bmp);
    if(!r.length) return toast("لم يُعثر على كودبار في الصورة",true);
    r.forEach(x=>view==="att"?attScan(x.rawValue):scanCode(x.rawValue));
  }catch(e){ toast("تعذّرت قراءة الصورة",true) }
}

function cdText(at){ const left=Math.max(0,Number(at)-Date.now()); return Math.floor(left/60000)+":"+String(Math.floor(left%60000/1000)).padStart(2,"0"); }

function sendNow(id){ const a=S.absences.find(x=>x.id===id); if(a) put("absences",{...a,notifyAt:Date.now(),...(a.status==="failed"?{status:"waiting",attempts:0,lastError:""}:{})}); }

/* --- Automatic SMS from the device SIM --- */
let sending=false;
async function autoSendTick(){
  if(sending||!autoOn()||licBlocked()) return;
  const w=S.cfg.sendWindow||{}, hm=nowHM();
  if((w.from&&hm<w.from)||(w.to&&hm>w.to)) return; // خارج ساعات الإرسال المسموحة
  const due=S.absences.filter(a=>a.status==="waiting"&&a.notifyAt<=Date.now()&&(a.attempts||0)<3);
  if(!due.length) return;
  sending=true;
  try{
    for(const a of due){
      const st=S.students.find(s=>s.id===a.studentId)||{};
      const phone=intlPhone(st.phone);
      if(!phone){ await put("absences",{...a,status:"failed",lastError:"لا يوجد رقم هاتف للولي"}); continue; }
      const sim=pickSim(st.phone), key=simKey(sim);
      if(creditPaused().includes(key)) continue; // الشريحة متوقفة لنفاد الرصيد
      try{
        await smsPlugin().send({phone:"+"+phone,message:message(a),...(sim!=null?{subscriptionId:sim}:{})});
        simFails[key]=0;
        await put("absences",{...a,status:"sent",channel:"sms",via:simLabel(sim),sentAt:Date.now(),attempts:(a.attempts||0)+1,lastError:""});
      }catch(e){
        const err=String((e&&e.message)||e).slice(0,300), credit=e&&e.code==="GENERIC";
        if(credit) simFails[key]=(simFails[key]||0)+1;
        if(credit&&simFails[key]>=2){
          // فشلان متتاليان من نفس الشريحة: نفاد الرصيد على الأرجح — لا تُحتسب المحاولة، وتبقى الرسالة في الانتظار
          await put("absences",{...a,status:"waiting",lastError:err,notifyAt:Date.now()+120000});
          await creditAlarm(sim);
          continue;
        }
        const n=(a.attempts||0)+1;
        await put("absences",{...a,attempts:n,status:n>=3?"failed":"waiting",lastError:err,notifyAt:Date.now()+120000});
      }
    }
  }finally{ sending=false; }
}
setInterval(()=>autoSendTick().catch(()=>{}),5000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) autoSendTick().catch(()=>{}); });

function pickLogo(inp){

  r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const M=256, k=Math.min(1,M/Math.max(img.width,img.height)); const cv=document.createElement("canvas");
    cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);

}

function pinHash(p){ let h=2166136261; const t="ghiyab|"+p; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return "h"+h.toString(36); }

  el.innerHTML=`<div class="lockbox">

    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="lockKey('${n}')">${n}</button>`).join("")}<button onclick="lockKey('del')">⌫</button><button onclick="lockKey('0')">0</button><button class="ok" onclick="lockKey('ok')">دخول</button></div>
    <button class="linkbtn" onclick="lockForgot()">نسيت الرمز؟</button>
    <div class="lockfoot"><img src="${APP.icon}" alt=""> <span><b>${APP.full}</b> ${esc(APP.version)}<br><span class="by">by TitteriSoft</span></span></div></div>`;

function lockDots(){ const d=document.getElementById("lockDots"); if(d) d.innerHTML=Array.from({length:Math.max(4,lockBuf.length)},(_,i)=>`<i class="${i<lockBuf.length?"on":""}"></i>`).join(""); }
function lockKey(k){
  const err=document.getElementById("lockErr"); if(err) err.textContent="";
  if(k==="del") lockBuf=lockBuf.slice(0,-1);
  else if(k==="ok") return lockTry();
  else if(lockBuf.length<8) lockBuf+=k;
  lockDots();
  if(lockBuf.length>=4&&pinHash(lockBuf)===S.cfg.appPin) lockTry();
}
function lockTry(){
  if(pinHash(lockBuf)===S.cfg.appPin||(S.cfg.pin&&lockBuf===S.cfg.pin)){
    if(S.cfg.pin&&lockBuf===S.cfg.pin) unlockUntil=Date.now()+15*60000; // رمز الإدارة يفتح أيضاً صفحات الإدارة
    locked=false; lastTouch=Date.now(); lockBuf=""; const el=document.getElementById("lock"); el.classList.add("hide"); el.innerHTML=""; render(); return;
  }
  lockBuf=""; lockDots(); const err=document.getElementById("lockErr"); if(err) err.textContent="الرمز غير صحيح";
  try{ navigator.vibrate&&navigator.vibrate(150); }catch(e){}
}

const getSess=id=>S.sessions.find(x=>x.id===id);
function ensureSession(se){
  const ex=getSess(se.id);
  if(ex){ Object.assign(ex,{subject:se.subject,teacher:se.teacher,from:se.from,to:se.to}); }
  else S.sessions.push({...se,notes:"",createdAt:Date.now(),roster:S.students.filter(s=>s.classId===se.classId).map(s=>s.id)});
  saveLocal();
}
function saveNotes(id,v){ const x=getSess(id); if(x){ x.notes=v; saveLocal(); } }
// كل الحصص (المحفوظة + القديمة المستنتجة من الغيابات)
function allSessions(){
  const map={}; S.sessions.forEach(x=>map[x.id]={...x});
  S.absences.forEach(a=>{ if(!map[a.sessionId]) map[a.sessionId]={id:a.sessionId,classId:a.classId,subject:a.subject,teacher:a.teacher,date:a.date,from:a.from,to:a.to,notes:"",legacy:true}; });
  return Object.values(map);
}
function sessionData(id){
  const se=allSessions().find(x=>x.id===id); if(!se) return null;
  const abs=S.absences.filter(a=>a.sessionId===id);
  const absIds=new Set(abs.map(a=>a.studentId));
  const rosterIds=(se.roster&&se.roster.length)?se.roster:S.students.filter(s=>s.classId===se.classId).map(s=>s.id);
  const ids=new Set([...rosterIds,...absIds]);
  const studs=[...ids].map(i=>S.students.find(s=>s.id===i)||(()=>{const a=abs.find(x=>x.studentId===i);return a?{id:i,name:a.studentName,code:a.code}:null})()).filter(Boolean)
    ;
  return {se,abs,present:studs.filter(s=>!absIds.has(s.id)),absent:studs.filter(s=>absIds.has(s.id)).map(s=>({...s,a:abs.find(x=>x.studentId===s.id)})),total:studs.length};
}
let sessDate=todayStr(), sessClass="";
function vSessions(){
  const list=allSessions().filter(x=>x.date===sessDate&&(!sessClass||x.classId===sessClass)).sort((a,b)=>a.from.localeCompare(b.from));
  return `<div class="card noprint"><h2>سجل الحصص</h2><div class="row" style="align-items:end">
      <label class="f" style="margin:0">اليوم<input type="date" value="${sessDate}" onchange="sessDate=this.value;render()"></label>
      <label class="f" style="margin:0">القسم<select onchange="sessClass=this.value;render()"><option value="">كل الأقسام</option>${S.classes.map(c=>`<option value="${c.id}" ${c.id===sessClass?"selected":""}>${esc(c.name)}</option>`).join("")}</select></label>
    </div></div>

const ymd=dt=>dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const addDays=(d,n)=>{ const x=new Date(d+"T12:00:00"); x.setDate(x.getDate()+n); return ymd(x); };
const MONTHS=["جانفي","فيفري","مارس","أفريل","ماي","جوان","جويلية","أوت","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const absHours=a=>Math.max(0,(hmMin(a.to)-hmMin(a.from))/60)||1;
const fmtH=h=>(Math.round(h*10)/10).toString().replace(".",",");
let rp={type:"class",range:"week",date:todayStr(),month:todayStr().slice(0,7),term:0,from:todayStr().slice(0,8)+"01",to:todayStr(),cls:"",stu:"",only:false};
function yearRange(){ const t=S.cfg.terms||[]; if(t.length){ return [t.map(x=>x.from).sort()[0],t.map(x=>x.to).sort().slice(-1)[0]]; }
  const y=parseInt(S.cfg.schoolYear)||new Date().getFullYear(); return [y+"-09-01",(y+1)+"-08-31"]; }
function rpRange(){
  if(rp.range==="day") return [rp.date,rp.date,`يوم ${DAY_NAMES[new Date(rp.date+"T12:00:00").getDay()]} ${fmtDate(rp.date)}`];
  if(rp.range==="week"){ const d=new Date(rp.date+"T12:00:00"); const a=addDays(rp.date,-d.getDay()); const b=addDays(a,6); return [a,b,`الأسبوع من ${fmtDate(a)} إلى ${fmtDate(b)}`]; }
  if(rp.range==="month"){ const [y,m]=rp.month.split("-").map(Number); const a=`${y}-${String(m).padStart(2,"0")}-01`; const b=ymd(new Date(y,m,0,12)); return [a,b,`شهر ${MONTHS[m-1]} ${y}`]; }
  if(rp.range==="term"){ const t=(S.cfg.terms||[])[rp.term]||{name:"",from:todayStr(),to:todayStr()}; return [t.from,t.to,`${t.name} (${fmtDate(t.from)} — ${fmtDate(t.to)})`]; }
  if(rp.range==="year"){ const [a,b]=yearRange(); return [a,b,`السنة الدراسية ${S.cfg.schoolYear||""}`]; }
  return [rp.from,rp.to,`من ${fmtDate(rp.from)} إلى ${fmtDate(rp.to)}`];
}
const inR=(d,[a,b])=>d>=a&&d<=b;
function classStats(cid,R){
  const abs=S.absences.filter(a=>a.classId===cid&&inR(a.date,R));
  const sess=allSessions().filter(x=>x.classId===cid&&inR(x.date,R)&&(x.savedAt||x.legacy||S.absences.some(a=>a.sessionId===x.id)));
  const slots=sess.reduce((n,x)=>n+((x.roster&&x.roster.length)||classStudents(cid).length),0);
  const hours=abs.reduce((h,a)=>h+absHours(a),0), unj=abs.filter(a=>!a.justified);
  return {abs,sess,hours,unjHours:unj.reduce((h,a)=>h+absHours(a),0),unj:unj.length,rate:slots?Math.round((1-abs.length/slots)*1000)/10:100};
}

function detectCols(rows){
  for(let h=0;h<Math.min(12,rows.length);h++){ const r=rows[h]||[]; const m={};
    r.forEach((v,i)=>{ v=String(v||"").trim(); if(!v) return; for(const k of Object.keys(COLS)) if(m[k]==null&&COLS[k].test(v)){ m[k]=i; break; } });
    if(m.full!=null||(m.last!=null&&m.first!=null)||(Object.keys(m).length>=2&&(m.first!=null||m.last!=null))) return {head:h,m};
  }

}

function playBell(kind,vol){
  const A=audioCtx(); if(!A) return;
  const b=BELLS[kind]||BELLS.soft, v=Math.max(0.02,Math.min(1,(vol??S.cfg.bellVol??50)/100))*0.35, t0=A.currentTime+0.05;
  b.notes.forEach(([f,dt])=>{
    const dur=b.long?4:1.8;
    [[1,1],[2,0.18],[3,0.06]].forEach(([h,amp])=>{ // نغمة أساسية + توافقيات خفيفة = صوت جرس ناعم
      const o=A.createOscillator(), g=A.createGain();
      o.type="sine"; o.frequency.value=f*h; o.connect(g); g.connect(A.destination);
      const t=t0+dt; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v*amp,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur/h);
      o.start(t); o.stop(t+dur/h+0.05);
    });
  });
}
function bellTimesToday(){
  const d=todayStr(), c=calOn(d);
  if(c&&c.type==="holiday") return [];
  if(c&&c.type==="exam") return [...new Set((S.exams||[]).filter(e=>e.date===d&&e.calId===c.id).map(e=>e.from))];
  if(!(S.cfg.days||[]).includes(new Date().getDay())) return [];
  return [...new Set(periodsOn(d).map(p=>p.from).filter(Boolean))];
}
let bellDone={};
setInterval(()=>{
  if(!S.cfg.bellOn||licBlocked()) return;
  const hm=nowHM(), d=todayStr(), pre=Number(S.cfg.bellPre||0);
  bellTimesToday().forEach(from=>{
    const at=pre?addHM(from,-pre):from, key=d+"_"+from;
    if(hm===at&&!bellDone[key]){
      bellDone[key]=1; playBell(S.cfg.bellSound);
      if(S.cfg.bellToast!==false) toast(pre?`🔔 تبدأ الحصة بعد ${pre} دقائق (${from})`:`🔔 بدأت حصة ${from} — سجّل الغياب`);
    }
  });
},10000);

/* ============ الترخيص — مفاتيح مركز التراخيص (HD1 · ECDSA P-256) ============ */
// المفتاح العام لحضوري: يُنسخ من مركز التراخيص (الإعدادات ← المفاتيح العامة). فارغ = الترخيص غير مفعّل.
const LIC_PUB={x:"0234371197d3f7b732e7d7ebd55cb991cc894f2f11dc2c746f049322d06c6b38",y:"17260ffa84cd54c1f39447bbd57aa18f9df9450aa2917d82b3245fc00b2230d4"};
const LIC_ON=!!(LIC_PUB.x&&LIC_PUB.y);
const TRIAL_DAYS=30;
let LIC={st:LIC_ON?"check":"off"}, DEVCODE="";
const licGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const licSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const b64uD=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const b64uE=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const hexB=h=>Uint8Array.from(h.match(/../g),x=>parseInt(x,16));
const ymdN=d=>d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
const ymdD=n=>new Date(Math.floor(n/10000),Math.floor(n/100)%100-1,n%100);
const ymdTxt=n=>n?String(n).replace(/(\d{4})(\d\d)(\d\d)/,"$3/$2/$1"):"مدى الحياة";
const dBetween=(a,b)=>Math.round((ymdD(b)-ymdD(a))/864e5);
// تاريخ اليوم مع حماية من إرجاع ساعة الجهاز إلى الوراء
function licToday(){ const t=ymdN(new Date()), seen=+licGet("hodouri_seen")||0; if(t>seen) licSet("hodouri_seen",String(t)); return Math.max(t,seen); }
async function devCode(){
  if(DEVCODE) return DEVCODE;
  let seed=""; const p=smsPlugin();
  if(p&&p.getDeviceId){ try{ const r=await p.getDeviceId(); seed=(r&&r.id)||""; }catch(e){} }
  if(!seed){ seed=licGet("hodouri_seed"); if(!seed){ seed=b64uE(crypto.getRandomValues(new Uint8Array(12))); licSet("hodouri_seed",seed); } }
  const h=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode("HODOURI|"+seed)));
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c="";
  for(let i=0;i<12;i++){ c+=A[h[i]%32]; if(i===3||i===7) c+="-"; }
  return DEVCODE=c;
}
async function licVerify(raw){
  const m=String(raw||"").replace(/\s+/g,"").match(/HD1\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)/);
  if(!m) return {ok:false,why:"لم يُعثر على مفتاح حضوري (يبدأ بـ HD1.)"};
  let pay,sig; try{ pay=b64uD(m[1]); sig=b64uD(m[2]); }catch(e){ return {ok:false,why:"المفتاح ناقص أو مشوّه"}; }
  let good=false;
  try{
    const k=await crypto.subtle.importKey("jwk",{kty:"EC",crv:"P-256",x:b64uE(hexB(LIC_PUB.x)),y:b64uE(hexB(LIC_PUB.y)),ext:true},{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    good=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},k,sig,pay);
  }catch(e){ good=false; }
  if(!good) return {ok:false,why:"المفتاح غير صالح"};
  const [dev,exp]=new TextDecoder().decode(pay).split("|"), e=+exp||0;
  if(dev!==await devCode()) return {ok:false,why:"هذا المفتاح صادر لجهاز آخر ("+dev+")"};
  if(e&&e<licToday()) return {ok:false,expired:true,exp:e,why:"انتهت صلاحية هذا المفتاح في "+ymdTxt(e)};
  return {ok:true,exp:e,key:m[0]};
}
async function licCheck(){
  if(!LIC_ON){ LIC={st:"off"}; return; }
  await devCode(); const today=licToday(), key=licGet("hodouri_lic");
  if(key){
    const r=await licVerify(key);
    if(r.ok){ LIC={st:"ok",exp:r.exp,left:r.exp?dBetween(today,r.exp):null}; return; }
    if(r.expired){ LIC={st:"expired",exp:r.exp}; return; }
  }
  // الفترة التجريبية: تبدأ عند أول تشغيل وتُحفظ أيضاً في الإعدادات (فتنتقل مع النسخة الاحتياطية)
  let t0=+licGet("hodouri_t0")||0; const c0=+(S.cfg.lt0||0);
  if(c0&&(!t0||c0<t0)) t0=c0; if(!t0) t0=today;
  licSet("hodouri_t0",String(t0)); if(S.cfg.lt0!==t0){ S.cfg.lt0=t0; saveLocal(); }
  const left=TRIAL_DAYS-dBetween(t0,today);
  LIC=left>0?{st:"trial",left}:{st:"trialEnd"};
}
const licBlocked=()=>LIC.st==="expired"||LIC.st==="trialEnd";
function licStatusTag(){
  return ({ok:LIC.exp?`<span class="tag ok">مرخّص حتى ${ymdTxt(LIC.exp)}</span>`:`<span class="tag ok">ترخيص مدى الحياة</span>`,
    trial:`<span class="tag amb">نسخة تجريبية — باقي ${LIC.left} يوماً</span>`,
    trialEnd:`<span class="tag red">انتهت الفترة التجريبية</span>`,
    expired:`<span class="tag red">انتهى الترخيص في ${ymdTxt(LIC.exp)}</span>`,
    check:`<span class="tag">جارٍ التحقق…</span>`})[LIC.st]||"";
}
function licWaLink(){
  const msg="السلام عليكم، أطلب مفتاح ترخيص تطبيق حضوري – HODOURI.\nالمؤسسة: "+(S.cfg.school||"")+(S.cfg.commune?" — "+S.cfg.commune:"")+"\nرمز الجهاز: "+DEVCODE;
  return "https://wa.me/213"+APP.wa.replace(/^0/,"")+"?text="+encodeURIComponent(msg);
}
function licBox(){
  const tgt=IS_APP?"":'target="_blank" rel="noopener"';
  return `<div class="licbox">
    <div class="muted">رمز هذا الجهاز</div>
    <div class="devcode" dir="ltr">${esc(DEVCODE||"…")}</div>
    <div class="row" style="justify-content:center;gap:8px">
      <button class="btn ghost" style="flex:0 0 auto" onclick="licCopy()">📋 نسخ الرمز</button>
      <a class="btn wabtn" style="flex:0 0 auto" href="${licWaLink()}" ${tgt}><img src="${WA_LOGO}" alt="" class="walogo"><span class="watxt"><small>اطلب المفتاح</small><b>عبر واتساب</b></span></a>
    </div>
    <label class="f" style="margin-top:12px">مفتاح التفعيل (الصق المفتاح أو الرسالة كاملة)
      <textarea id="licIn" rows="3" dir="ltr" placeholder="HD1.xxxxxxxx.xxxxxxxx"></textarea></label>
    <button class="btn" onclick="licActivate()">🔑 تفعيل</button>
  </div>`;
}
function licCard(){
  if(!LIC_ON) return "";
  return `<div class="card"><h2>🔑 الترخيص</h2><p>${licStatusTag()}</p>
    ${LIC.st==="ok"?`<details><summary class="muted">رمز الجهاز وتغيير المفتاح</summary>${licBox()}</details>`:licBox()}</div>`;
}
function vLicWall(){
  return `<div class="card about">
    <img src="${APP.icon}" alt="" class="aicon">
    <h1>${APP.name} <span class="latin">${APP.latin}</span></h1>
    <p>${licStatusTag()}</p>
    <p class="muted">لمواصلة استعمال التطبيق أرسل رمز الجهاز إلى TitteriSoft واحصل على مفتاح التفعيل.<br>بياناتك محفوظة كما هي ولن تضيع.</p>
    ${licBox()}
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn ghost" style="flex:0 0 auto" onclick="saveBackupNow()">💾 حفظ نسخة احتياطية من البيانات</button></div>
  </div>`;
}
function licBanner(){
  if(LIC.st==="trial") return `<div class="licban" onclick="view='settings';setTab='about';render()">🔑 نسخة تجريبية — باقي <b>${LIC.left}</b> يوماً. اضغط هنا للتفعيل.</div>`;
  if(LIC.st==="ok"&&LIC.exp&&LIC.left<=15) return `<div class="licban" onclick="view='settings';setTab='about';render()">⏳ ينتهي الترخيص بعد <b>${LIC.left}</b> يوماً (${ymdTxt(LIC.exp)}). اضغط هنا للتجديد.</div>`;
  return "";
}
async function licCopy(){ try{ await navigator.clipboard.writeText(DEVCODE); toast("نُسخ رمز الجهاز"); }catch(e){ toast("رمز الجهاز: "+DEVCODE); } }
async function licActivate(){
  const v=(document.getElementById("licIn")||{}).value||"";
  const r=await licVerify(v);
  if(!r.ok) return toast(r.why,true);
  licSet("hodouri_lic",r.key); await licCheck();
  toast(r.exp?"✓ تم التفعيل — صالح حتى "+ymdTxt(r.exp):"✓ تم التفعيل — ترخيص مدى الحياة");
}

/* ============ Boot ============ */
setTimeout(()=>{ if(S.cfg.appPin) showLock(); },0);
window.addEventListener("resize",()=>{ if(["report","reports","letter"].includes(view)&&!zoom) render(); });
render();
licCheck().then(render).catch(()=>{});
setInterval(()=>{ licCheck().then(()=>{ if(licBlocked()) render(); }).catch(()=>{}); },3600000);
if(IS_APP){ try{ const p=smsPlugin(); p&&p.keepAwake&&p.keepAwake(); }catch(e){} }
let lastAct=-1;
setInterval(()=>{
  const n=needAction().length;
  if(lastAct>=0&&n>lastAct){ try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){} toast("🔔 إشعارات تحتاج إجراء — افتح «الإشعارات»"); }
  lastAct=n; updateBadge();
  if(view==="notifs") document.querySelectorAll("[data-cd]").forEach(el=>{ el.textContent=cdText(el.dataset.cd); });
},1000);
// صفحة تسجيل الغياب تتبع الوقت: تحديث الحصص الجارية كل 30 ثانية
setInterval(()=>{ if(view!=="session") return; const ae=document.activeElement;
  if(ae&&["INPUT","TEXTAREA","SELECT"].includes(ae.tagName)&&ae.id!=="scanInput") return; if(document.getElementById("modal").innerHTML) return; render(); },30000);
// إعادة رسم صفحة الإشعارات عند تغيّر الحالات
let lastSig="";
setInterval(()=>{ if(view!=="notifs") return; const ae=document.activeElement; if(ae&&["INPUT","TEXTAREA","SELECT"].includes(ae.tagName)) return;
  const sig=S.absences.map(a=>a.id+a.status+(a.notifyAt<=Date.now())).join(); if(sig!==lastSig){ lastSig=sig; render(); } },2000);
</script>
