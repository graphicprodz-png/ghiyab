<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غياب — إعلام الأولياء بغياب التلاميذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="capacitor.js"></script>
<style>
:root{
  --bg:#f4f6f5;--card:#fff;--ink:#14231c;--muted:#5d6e66;--line:#dfe6e2;
  --brand:#0f6b4f;--brand-2:#e8f3ee;--red:#c0392b;--red-2:#fbeceA;--amber:#b7791f;--amber-2:#fdf3e1;
  --wa:#1f9d55;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
header .sub{font-size:12.5px;opacity:.85;margin-top:2px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#fff;opacity:.75;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;font-weight:600}
nav button.on{opacity:1;border-color:#fff}
nav .badge{background:#fff;color:var(--brand);border-radius:99px;padding:0 7px;font-size:12px;margin-inline-start:4px}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:3px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}
.btn.ghost{background:var(--brand-2);color:var(--brand)}
.btn.red{background:var(--red)}
.btn.wa{background:var(--wa)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:13px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stu{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:#fff;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:2px;transition:.12s}
.stu .n{font-weight:700}
.stu .c{font-size:12px;color:var(--muted);direction:ltr;text-align:end}
.stu.abs{border-color:var(--red);background:var(--red-2)}
.stu.abs .n{color:var(--red)}
.stu.locked{cursor:default}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px}
.tag.red{background:var(--red-2);color:var(--red)}
.tag.amb{background:var(--amber-2);color:var(--amber)}
.tag.ok{background:var(--brand-2);color:var(--brand)}
.scan{display:flex;gap:8px;align-items:center;background:var(--brand-2);border-radius:12px;padding:10px;margin-bottom:10px;flex-wrap:wrap}
.scan input{flex:1 1 180px;direction:ltr;text-align:center;font-weight:700;letter-spacing:2px}
.flash{padding:8px 12px;border-radius:10px;margin-bottom:10px;font-weight:600;font-size:14px}
.flash.ok{background:var(--brand-2);color:var(--brand)}
.flash.err{background:var(--red-2);color:var(--red)}
.notif{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}
.notif .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.notif .msg{background:#f2f7f4;border-radius:10px;padding:9px 11px;font-size:13.5px;margin:8px 0;white-space:pre-wrap;line-height:1.7}
.notif .act{display:flex;gap:6px;flex-wrap:wrap}
.cd{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.ltr{direction:ltr;text-align:end}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.label{border:1px dashed #9aa9a2;border-radius:8px;padding:8px;background:#fff;text-align:center;break-inside:avoid}
.label .ln{font-weight:700;font-size:14px}
.label .lc{font-size:11.5px;color:var(--muted)}
.label svg{width:100%;height:54px;display:block;margin:4px 0 0}
.label .code{direction:ltr;font-weight:700;letter-spacing:3px;font-size:13px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;background:rgba(255,255,255,.18);border-radius:99px;padding:2px 9px;margin-top:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#ffd166}
.dot.live{background:#7CFFB2}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dialog{background:#fff;border-radius:16px;padding:16px;max-width:420px;width:100%}
.hide{display:none!important}
.segs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.segs button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--muted)}
.segs button.on{background:var(--brand);color:#fff}
.logobox{width:96px;height:96px;border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;text-align:center;font-size:12px}
.logobox img{max-width:100%;max-height:100%;object-fit:contain}
.offhead{display:flex;align-items:center;gap:12px;justify-content:center;text-align:center;line-height:1.7;font-size:13.5px}
.offhead img{width:64px;height:64px;object-fit:contain}
.offhead.compact{font-size:12px;line-height:1.5}
.label{position:relative}
.label .llogo{position:absolute;top:6px;inset-inline-start:6px;width:22px;height:22px;object-fit:contain}
.printonly{display:none}
.rtool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:10px}
.rtool .zoom{display:inline-flex;gap:4px;align-items:center;margin-inline-start:auto}
.rtool .zoom b{min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.sheetwrap{overflow:auto;direction:ltr}
.sheet{direction:rtl;width:1123px;height:794px;background:#fff;color:#000;transform-origin:top left;box-shadow:0 2px 14px rgba(0,0,0,.12);padding:30px 38px;display:flex;flex-direction:column;gap:10px;font-size:13px;overflow:hidden;page:landscape}
.shead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;border-bottom:2px solid #000;padding-bottom:8px;line-height:1.55}
.shead .sh-c{text-align:center}.shead .sh-c img{height:52px;object-fit:contain}.shead h1{font-size:21px;margin:2px 0}
.shead .sh-l{text-align:left}
.sheet table{border-collapse:collapse;width:100%}
.sheet th,.sheet td{border:1px solid #444;padding:4px 7px;font-size:12.5px}
.sheet th{background:#eef3f0;font-weight:700;color:#000}
.sinfo th{width:70px}
.sstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sstats div{border:1px solid #444;border-radius:6px;text-align:center;padding:5px}.sstats b{display:block;font-size:20px}
.sstats .g b{color:#0f6b4f}.sstats .r b{color:#c0392b}
.scols{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;flex:1;min-height:0}
.scols h3,.snotes h3{margin:0 0 5px;font-size:14px;border-bottom:1px solid #999;padding-bottom:3px}
.names{columns:3;column-gap:16px;margin:0;padding-inline-start:22px;font-size:12px;line-height:1.55}
.sabs table td:first-child{width:24px;text-align:center}
.snotes>div{border:1px solid #444;min-height:40px;padding:5px 8px;border-radius:4px}
.ssign{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-weight:700;min-height:62px}
.ssign span{font-weight:400}
.sfoot{text-align:center;font-size:10.5px;color:#555}
@page landscape{size:A4 landscape;margin:0}
@media print{
  body.rep header,body.rep .rtool,body.rep .flash{display:none!important}
  body.rep main{padding:0;max-width:none}
  body.rep .sheetwrap{height:auto!important;overflow:visible}
  html,body.rep{background:#fff!important}
  body.rep main>*:not(.sheetwrap),body.rep #modal{display:none!important}
  body.rep .sheet{transform:none!important;box-shadow:none;width:297mm;height:205mm;break-after:avoid;page-break-after:avoid}
}
@media print{.printonly{display:block}}
table.tt{min-width:640px;table-layout:fixed}
table.tt th{text-align:center;font-size:12.5px;padding:6px 3px}
table.tt th.tp{width:58px;font-variant-numeric:tabular-nums;color:var(--muted);line-height:1.3}
table.tt td{padding:3px;border:1px solid var(--line);vertical-align:top}
table.tt td.full{background:var(--brand-2)}
table.tt select{width:100%;padding:5px 3px;font-size:12.5px;border-radius:7px;background:transparent}
table.tt td.full select{font-weight:700;color:var(--brand)}
.tteach{font-size:11px;color:var(--muted);text-align:center;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand-2);border-radius:99px;padding:4px 10px;font-size:13.5px}
.chip button{border:0;background:none;color:var(--red);cursor:pointer;font-size:12px;padding:0}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.banner.ok{background:var(--brand-2);color:var(--brand)}
.banner.amb{background:var(--amber-2);color:var(--amber)}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:10px}
.switch input{width:22px;height:22px;accent-color:var(--brand)}
@media print{header,.noprint{display:none!important}main{padding:0}.card{border:0}}
</style>
</head>
<body>
<header>
  <h1><span id="hLogo">📋</span> <span id="schoolTitle">غياب</span></h1>
  <div class="sub" id="hDir"></div>
  <div class="sub">تسجيل غياب التلاميذ وإعلام الأولياء آلياً عبر SMS</div>
    <nav id="nav">
    <button data-v="session" class="on">تسجيل الغياب</button>
    <button data-v="sessions">سجل الحصص</button>
    <button data-v="notifs">الإشعارات <span class="badge hide" id="dueBadge">0</span></button>
    <button data-v="students">الأقسام والتلاميذ</button>
    <button data-v="timetable">جدول التوقيت</button>
    <button data-v="staff">المواد والأساتذة</button>
    <button data-v="labels">ملصقات الكودبار</button>
    <button data-v="settings">الإعدادات</button>
  </nav>
</header>
<main id="main"></main>
<div id="modal"></div>

<script>
/* ============ Data layer: shared db when available, otherwise this browser ============ */
const DEFAULT_CFG={
  school:"ثانوية النموذجية",
  schoolType:"ثانوية",
  directorate:"",
  schoolCode:"",
  commune:"",
  address:"",
  schoolPhone:"",
  schoolEmail:"",
  director:"",
  counselor:"",
  attendanceOfficer:"",
  logo:"",
  sendWindow:{from:"07:30",to:"18:30"},
  pin:"",
  lastBackup:0,
  autoSms:true,
  sameOperator:true,
  simMap:{},
  simDefault:null,
  simsCache:[],
  delayMin:15,
  schoolYear:"2026/2027",
  days:[0,1,2,3,4],
  periods:[{id:"p1",from:"08:00",to:"09:00"},{id:"p2",from:"09:00",to:"10:00"},{id:"p3",from:"10:00",to:"11:00"},{id:"p4",from:"11:00",to:"12:00"},
           {id:"p5",from:"13:00",to:"14:00"},{id:"p6",from:"14:00",to:"15:00"},{id:"p7",from:"15:00",to:"16:00"},{id:"p8",from:"16:00",to:"17:00"}],
  cc:"213",
  template:"{المؤسسة}: ابنكم {الاسم} ({القسم}) غائب عن حصة {المادة} يوم {التاريخ} من {من} إلى {إلى}."
};
const S={classes:[],students:[],absences:[],subjects:[],teachers:[],timetable:[],sessions:[],cfg:{...DEFAULT_CFG}};
const DB=null;
const LS_KEY="ghiyab_v1";
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const DATA_KEYS=["classes","students","absences","subjects","teachers","timetable","sessions"];
function saveLocal(){ if(!DB){ const o={cfg:S.cfg}; DATA_KEYS.forEach(k=>o[k]=S[k]); lsSet(LS_KEY,o); } }
const DEFAULT_SUBJECTS=["الرياضيات","اللغة العربية","اللغة الفرنسية","اللغة الإنجليزية","العلوم الطبيعية","العلوم الفيزيائية","التاريخ والجغرافيا","التربية الإسلامية","الفلسفة","الإعلام الآلي","التربية البدنية","التربية المدنية","اللغة الأمازيغية"];
(function loadLocal(){
  const d=lsGet(LS_KEY);
  if(d){ DATA_KEYS.forEach(k=>{ if(Array.isArray(d[k])) S[k]=d[k]; }); S.cfg={...DEFAULT_CFG,...(d.cfg||{})}; }
  if(!S.subjects.length&&!S.cfg.subjectsSeeded){ S.subjects=DEFAULT_SUBJECTS.map((n,i)=>({id:"sub"+i,name:n})); S.cfg.subjectsSeeded=true; saveLocal(); }
})();

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const strip=o=>{const c={...o};delete c.id;return c};

async function put(col,obj){
  if(DB){ try{ await DB.collection(col).doc(obj.id).set(strip(obj)); }catch(e){ toast("تعذّر الحفظ: "+(e.message||e.code),true) } return; }
  const arr=S[col]; const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0) arr[i]=obj; else arr.push(obj);
  saveLocal(); render();
}
async function del(col,id){
  if(DB){ try{ await DB.collection(col).doc(id).delete(); }catch(e){ toast("تعذّر الحذف",true) } return; }
  S[col]=S[col].filter(x=>x.id!==id); saveLocal(); render();
}
async function saveCfg(cfg){
  S.cfg=cfg;
  if(DB){ try{ await DB.doc("config/main").set(cfg);}catch(e){toast("تعذّر حفظ الإعدادات",true)} }
  else { saveLocal(); }
  render();
}

/* ============ Native (APK) ============ */
const IS_APP=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
let _sms=null;
function smsPlugin(){
  if(!IS_APP) return null;
  if(_sms) return _sms;
  const C=window.Capacitor;
  _sms=(typeof C.registerPlugin==="function"?C.registerPlugin("SmsSender"):null)||(C.Plugins&&C.Plugins.SmsSender)||null;
  return _sms;
}
const autoOn=()=>IS_APP&&!!S.cfg.autoSms&&!!smsPlugin();

/* ============ Helpers ============ */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const addHM=(hm,min)=>{const[h,m]=hm.split(":").map(Number);const t=h*60+m+min;return String(Math.floor(t/60)%24).padStart(2,"0")+":"+String(t%60).padStart(2,"0")};
const fmtDate=s=>{try{const[y,m,d]=s.split("-");return d+"/"+m+"/"+y}catch(e){return s}};
const cls=id=>S.classes.find(c=>c.id===id);
const stuByCode=code=>S.students.find(s=>s.code===String(code).trim());
/* ============ المتعاملون: موبيليس، جيزي، أوريدو ============ */
const OPS={mobilis:{name:"موبيليس",color:"#1f9d55",re:/mobilis|algerie\s*telecom|\bATM\b/i},djezzy:{name:"جيزي",color:"#c0392b",re:/djezzy|optimum/i},ooredoo:{name:"أوريدو",color:"#b7791f",re:/ooredoo|nedjma|wataniya/i}};
function operatorOf(p){
  let d=String(p||"").replace(/[^\d+]/g,"");
  if(d.startsWith("+213")) d="0"+d.slice(4); else if(d.startsWith("00213")) d="0"+d.slice(5); else if(d.startsWith("213")&&d.length===12) d="0"+d.slice(3);
  if(d.length!==10) return null;
  return {"06":"mobilis","07":"djezzy","05":"ooredoo"}[d.slice(0,2)]||null;
}
const opTag=(op)=>op?`<span class="tag" style="background:${OPS[op].color}1a;color:${OPS[op].color}">${OPS[op].name}</span>`:"";
function simLabel(id){ const x=(S.cfg.simsCache||[]).find(z=>String(z.id)===String(id)); return x?`شريحة ${x.slot+1} (${x.carrier||x.name})`:"الشريحة الافتراضية"; }
// الشريحة التي تُرسل منها رسالة هذا الولي
function pickSim(phone){
  const op=operatorOf(phone), m=S.cfg.simMap||{};
  if(S.cfg.sameOperator&&op&&m[op]!=null&&m[op]!=="") return Number(m[op]);
  return S.cfg.simDefault!=null&&S.cfg.simDefault!==""?Number(S.cfg.simDefault):undefined;
}
async function detectSims(){
  const pl=smsPlugin(); if(!pl||!pl.getSims) return toast("اكتشاف الشرائح يعمل في تطبيق الطابليت فقط",true);
  try{
    const r=await pl.getSims(); const sims=(r.sims||[]).sort((a,b)=>a.slot-b.slot);
    const map={...(S.cfg.simMap||{})};
    sims.forEach(x=>{ Object.keys(OPS).forEach(op=>{ if(OPS[op].re.test(x.carrier+" "+x.name)&&(map[op]==null||map[op]==="")) map[op]=x.id; }); });
    await saveCfg({...S.cfg,simsCache:sims,simMap:map});
    toast(sims.length?`وُجدت ${sims.length} شريحة`:"لم تُكتشف أي شريحة",!sims.length);
  }catch(e){ toast("تعذّر اكتشاف الشرائح: "+((e&&e.message)||e),true); }
}
function setSim(op,val){ const m={...(S.cfg.simMap||{})}; m[op]=val===""?null:Number(val); saveCfg({...S.cfg,simMap:m}); }

function intlPhone(p){
  let d=String(p||"").replace(/[^\d+]/g,"");
  if(d.startsWith("+")) return d.slice(1);
  if(d.startsWith("00")) return d.slice(2);
  if(d.startsWith("0")) return (S.cfg.cc||"213")+d.slice(1);
  return d;
}
function nextCode(){
  const yy=String(new Date().getFullYear()).slice(2);
  let max=0; S.students.forEach(s=>{ if(s.code&&s.code.startsWith(yy)){const n=parseInt(s.code.slice(2),10); if(n>max) max=n;} });
  return yy+String(max+1).padStart(4,"0");
}
function message(a){
  const st=S.students.find(s=>s.id===a.studentId)||{name:a.studentName,code:a.code};
  const c=cls(a.classId);
  return (S.cfg.template||"")
    .replaceAll("{الاسم}",st.name||a.studentName||"")
    .replaceAll("{الرقم}",st.code||a.code||"")
    .replaceAll("{القسم}",c?c.name:(a.className||""))
    .replaceAll("{المادة}",a.subject||"")
    .replaceAll("{الأستاذ}",a.teacher||"")
    .replaceAll("{التاريخ}",fmtDate(a.date))
    .replaceAll("{من}",a.from||"")
    .replaceAll("{إلى}",a.to||"")
    .replaceAll("{المؤسسة}",S.cfg.school||"");
}

/* ============ Code 39 barcode (SVG) ============ */
const C39={"0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw","5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn","*":"nwnnwnwnn"};
function barcodeSVG(code){
  const chars=("*"+code+"*").split(""); let x=10; const N=2,W=5,H=60; let rects="";
  chars.forEach((ch,ci)=>{
    const p=C39[ch]; if(!p) return;
    for(let i=0;i<9;i++){ const w=p[i]==="w"?W:N; if(i%2===0) rects+=`<rect x="${x}" y="0" width="${w}" height="${H}"/>`; x+=w; }
    if(ci<chars.length-1) x+=N;
  });
  return `<svg viewBox="0 0 ${x+10} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

async function scanImage(inp){
  const f=inp.files&&inp.files[0]; inp.value=""; if(!f) return;
  if(!("BarcodeDetector" in window)) return toast("هذا المتصفح لا يقرأ الكودبار من الصور. استعمل قارئ كودبار أو اكتب الرقم.",true);
  try{
    const bmp=await createImageBitmap(f);
    const det=new BarcodeDetector({formats:["code_39","code_128","qr_code"]});
    const r=await det.detect(bmp);
    if(!r.length) return toast("لم يُعثر على كودبار في الصورة",true);
    r.forEach(x=>scanCode(x.rawValue));
  }catch(e){ toast("تعذّرت قراءة الصورة",true) }
}

function cdText(at){ const left=Math.max(0,Number(at)-Date.now()); return Math.floor(left/60000)+":"+String(Math.floor(left%60000/1000)).padStart(2,"0"); }

function sendNow(id){ const a=S.absences.find(x=>x.id===id); if(a) put("absences",{...a,notifyAt:Date.now(),...(a.status==="failed"?{status:"waiting",attempts:0,lastError:""}:{})}); }

/* --- Automatic SMS from the device SIM --- */
let sending=false;
async function autoSendTick(){
  if(sending||!autoOn()) return;
  const w=S.cfg.sendWindow||{}, hm=nowHM();
  if((w.from&&hm<w.from)||(w.to&&hm>w.to)) return; // خارج ساعات الإرسال المسموحة
  const due=S.absences.filter(a=>a.status==="waiting"&&a.notifyAt<=Date.now()&&(a.attempts||0)<3);
  if(!due.length) return;
  sending=true;
  try{
    for(const a of due){
      const st=S.students.find(s=>s.id===a.studentId)||{};
      const phone=intlPhone(st.phone);
      if(!phone){ await put("absences",{...a,status:"failed",lastError:"لا يوجد رقم هاتف للولي"}); continue; }
      try{
        const sim=pickSim(st.phone);
        await smsPlugin().send({phone:"+"+phone,message:message(a),...(sim!=null?{subscriptionId:sim}:{})});
        await put("absences",{...a,status:"sent",channel:"sms",via:simLabel(sim),sentAt:Date.now(),attempts:(a.attempts||0)+1,lastError:""});
      }catch(e){
        const n=(a.attempts||0)+1;
        await put("absences",{...a,attempts:n,status:n>=3?"failed":"waiting",lastError:String((e&&e.message)||e).slice(0,300),notifyAt:Date.now()+120000});
      }
    }
  }finally{ sending=false; }
}
setInterval(()=>autoSendTick().catch(()=>{}),5000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) autoSendTick().catch(()=>{}); });

async function bulkAdd(){
  const lines=document.getElementById("bulk").value.split("\n").map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return;
  const yy=String(new Date().getFullYear()).slice(2); let n=parseInt(nextCode().slice(2),10);
  for(const l of lines){
    const p=l.split(/[,،;\t]/).map(x=>x.trim());
    const o={id:uid(),code:yy+String(n++).padStart(4,"0"),name:p[0],parent:p[1]||"",phone:p[2]||"",classId:selClass};
    if(DB) await put("students",o); else { S.students.push(o); }

  if(!DB){saveLocal()} toast("أُضيف "+lines.length+" تلميذاً");
}

function pickLogo(inp){
  const f=inp.files&&inp.files[0]; inp.value=""; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const M=256, k=Math.min(1,M/Math.max(img.width,img.height)); const cv=document.createElement("canvas");
    cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    saveCfg({...S.cfg,logo:cv.toDataURL("image/png")}); toast("حُفظ الشعار"); };
    img.onerror=()=>toast("تعذّرت قراءة الصورة",true); img.src=r.result; };
  r.readAsDataURL(f);
}

const getSess=id=>S.sessions.find(x=>x.id===id);
function ensureSession(se){
  const ex=getSess(se.id);
  if(ex){ Object.assign(ex,{subject:se.subject,teacher:se.teacher,from:se.from,to:se.to}); }
  else S.sessions.push({...se,notes:"",createdAt:Date.now(),roster:S.students.filter(s=>s.classId===se.classId).map(s=>s.id)});
  saveLocal();
}
function saveNotes(id,v){ const x=getSess(id); if(x){ x.notes=v; saveLocal(); } }
// كل الحصص (المحفوظة + القديمة المستنتجة من الغيابات)
function allSessions(){
  const map={}; S.sessions.forEach(x=>map[x.id]={...x});
  S.absences.forEach(a=>{ if(!map[a.sessionId]) map[a.sessionId]={id:a.sessionId,classId:a.classId,subject:a.subject,teacher:a.teacher,date:a.date,from:a.from,to:a.to,notes:"",legacy:true}; });
  return Object.values(map);
}
function sessionData(id){
  const se=allSessions().find(x=>x.id===id); if(!se) return null;
  const abs=S.absences.filter(a=>a.sessionId===id);
  const absIds=new Set(abs.map(a=>a.studentId));
  const rosterIds=(se.roster&&se.roster.length)?se.roster:S.students.filter(s=>s.classId===se.classId).map(s=>s.id);
  const ids=new Set([...rosterIds,...absIds]);
  const studs=[...ids].map(i=>S.students.find(s=>s.id===i)||(()=>{const a=abs.find(x=>x.studentId===i);return a?{id:i,name:a.studentName,code:a.code}:null})()).filter(Boolean)
    .sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  return {se,abs,present:studs.filter(s=>!absIds.has(s.id)),absent:studs.filter(s=>absIds.has(s.id)).map(s=>({...s,a:abs.find(x=>x.studentId===s.id)})),total:studs.length};
}

      <span class="muted">${t?esc(t.name):'<span class="tag amb">الأستاذ غير محدد</span>'} · ${x.p.from}–${x.p.to}</span>${n?` <span class="tag red">${n} غائب</span>`:""}</div>
      <div class="row" style="flex:0 0 auto;gap:6px">${getSess(sid)?`<button class="btn ghost sm" onclick="openReport('${sid}')">📄</button>`:""}<button class="btn ${primary?"":"ghost"} sm" onclick="startFromSlot('${x.id}')">${getSess(sid)?"الدخول إلى الحصة":"تسجيل الغياب"}</button></div></div>`; };
  return `<div class="card"><h2>${DAY_NAMES[new Date().getDay()]} ${fmtDate(todayStr())} — حسب جدول التوقيت</h2>
    ${cur.length?`<h3 style="margin:4px 0 8px;font-size:14px;color:var(--brand)">● الحصص الجارية الآن</h3>${cur.map(x=>row(x,true)).join("")}`
      :`<p class="muted">لا توجد حصة جارية الآن حسب الجدول.</p>`}
    ${later.length?`<details ${cur.length?"":"open"}><summary class="muted" style="cursor:pointer;margin:8px 0">الحصص القادمة اليوم (${later.length})</summary>${later.map(x=>row(x,false)).join("")}</details>`:""}
    ${done.length?`<details><summary class="muted" style="cursor:pointer;margin:8px 0">حصص انتهت اليوم (${done.length})</summary>${done.map(x=>row(x,false)).join("")}</details>`:""}
  </div>`;
}
const ttSessionId=x=>"tt_"+x.id+"_"+todayStr();
function startFromSlot(slotId){
  const x=S.timetable.find(z=>z.id===slotId); if(!x) return;
  const p=period(x.periodId), t=slotTeacher(x);
  session={id:ttSessionId(x),slotId:x.id,classId:x.classId,subject:subj(x.subjectId).name,teacher:t?t.name:"—",date:todayStr(),from:p.from,to:p.to};
  ensureSession(session); lsSet("ghiyab_session",session); flashMsg=null; render();
  setTimeout(()=>{const s=document.getElementById("scanInput"); if(s) s.focus()},50);
}
// أثناء الحصة: عند انتهاء وقتها يقترح الحصة التالية لنفس القسم حسب الجدول
function nextSlotBanner(){
  if(!session||session.date!==todayStr()) return "";
  const now=hmMin(nowHM()); if(now<hmMin(session.to)) return "";
  const nxt=todaySlots().find(x=>x.classId===session.classId&&now>=hmMin(x.p.from)-10&&now<hmMin(x.p.to)&&ttSessionId(x)!==session.id);
  return `<div class="banner amb" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <span>⏰ انتهى وقت هذه الحصة (${session.to}).${nxt?` الحصة الحالية حسب الجدول: <b>${esc(subj(nxt.subjectId).name)}</b> ${nxt.p.from}–${nxt.p.to}`:""}</span>
    ${nxt?`<button class="btn sm" onclick="startFromSlot('${nxt.id}')">الانتقال إليها</button>`:`<button class="btn ghost sm" onclick="endSession()">إنهاء</button>`}</div>`;
}
function fillTeacher(){
  const c=cls(document.getElementById("sClass").value)||{}; const o=document.getElementById("sSubject").selectedOptions[0];
  const sid=o&&o.dataset.id; if(!sid) return;
  const t=teach((c.assign||{})[sid])||S.teachers.find(x=>x.subjectId===sid);
  if(t) document.getElementById("sTeacher").value=t.name;
}

/* --- صفحة جدول التوقيت --- */
let ttClass=null;
function vTimetable(){
  if(!S.classes.length) return emptyData();
  if(!ttClass||!cls(ttClass)) ttClass=selClass&&cls(selClass)?selClass:S.classes[0].id;
  const c=cls(ttClass), days=schoolDays(), pers=sortedPeriods();
  const used=[...new Set(S.timetable.filter(x=>x.classId===ttClass).map(x=>x.subjectId))].filter(subj);
  const assign=c.assign||{};
  const nSlots=S.timetable.filter(x=>x.classId===ttClass).length;
  return `<div class="card"><h2>جدول توقيت القسم</h2>
    <div class="row" style="align-items:end">
      <label class="f" style="margin:0">القسم<select onchange="ttClass=this.value;render()">${S.classes.slice().sort((a,b)=>a.name.localeCompare(b.name,"ar")).map(k=>`<option value="${k.id}" ${k.id===ttClass?"selected":""}>${esc(k.name)}</option>`).join("")}</select></label>
      <button class="btn ghost" style="flex:0 0 auto" onclick="copyTimetable()">نسخ الجدول من قسم آخر</button>
    </div>
    <p class="muted" style="margin:8px 0 0">اختر المادة في كل خانة. السنة الدراسية ${esc(S.cfg.schoolYear||"")} · ${nSlots} حصة في الأسبوع. الفترات وأيام الدراسة تُعدَّل من «الإعدادات».</p></div>
  ${flashHTML()}
  <div class="card" style="overflow-x:auto;padding:8px">
    <table class="tt"><tr><th></th>${days.map(d=>`<th>${DAY_NAMES[d]}</th>`).join("")}</tr>
    ${pers.map(p=>`<tr><th class="tp">${p.from}<br>${p.to}</th>${days.map(d=>{ const sl=slotAt(ttClass,d,p.id);
      return `<td class="${sl?"full":""}"><select onchange="setSlot(${d},'${p.id}',this.value)"><option value="">—</option>${S.subjects.map(x=>`<option value="${x.id}" ${sl&&sl.subjectId===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
        ${sl&&slotTeacher(sl)?`<div class="tteach">${esc(slotTeacher(sl).name)}</div>`:""}</td>`; }).join("")}</tr>`).join("")}
    </table></div>
  <div class="card"><h2>أستاذ كل مادة في ${esc(c.name)}</h2>
    ${used.length?`<div class="row">${used.map(sid=>{ const own=S.teachers.filter(t=>t.subjectId===sid), others=S.teachers.filter(t=>t.subjectId!==sid);
      return `<label class="f">${esc(subj(sid).name)}<select onchange="setAssign('${sid}',this.value)"><option value="">— اختر الأستاذ —</option>
        ${own.map(t=>`<option value="${t.id}" ${assign[sid]===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}
        ${others.length?`<optgroup label="أساتذة آخرون">${others.map(t=>`<option value="${t.id}" ${assign[sid]===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</optgroup>`:""}
      </select></label>`; }).join("")}</div>
      ${!S.teachers.length?`<p class="muted">أضف الأساتذة أولاً من «المواد والأساتذة».</p>`:""}`
    :`<p class="muted" style="margin:0">املأ الجدول أولاً، ثم اختر هنا أستاذ كل مادة.</p>`}
  </div>`;
}
function setSlot(day,pid,subjectId){
  const ex=slotAt(ttClass,day,pid);
  if(!subjectId){ if(ex) del("timetable",ex.id); return; }
  put("timetable",{...(ex||{id:uid(),classId:ttClass,day,periodId:pid}),subjectId});
}
function setAssign(sid,tid){ const c=cls(ttClass); put("classes",{...c,assign:{...(c.assign||{}),[sid]:tid||undefined}}); }
function copyTimetable(){
  const others=S.classes.filter(c=>c.id!==ttClass&&S.timetable.some(x=>x.classId===c.id));
  if(!others.length) return toast("لا يوجد قسم آخر له جدول",true);
  document.getElementById("modal").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="dialog">
    <h2 style="margin-top:0">نسخ جدول إلى ${esc(cls(ttClass).name)}</h2><p class="muted">سيُستبدل جدول هذا القسم بجدول القسم المختار (المواد فقط، الأساتذة تختارهم بعد ذلك).</p>
    <label class="f">من القسم<select id="cpFrom">${others.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label>
    <div class="row"><button class="btn" onclick="doCopyTimetable()">نسخ</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div></div></div>`;
}
function doCopyTimetable(){
  const from=document.getElementById("cpFrom").value;
  S.timetable=S.timetable.filter(x=>x.classId!==ttClass).concat(S.timetable.filter(x=>x.classId===from).map(x=>({id:uid(),classId:ttClass,day:x.day,periodId:x.periodId,subjectId:x.subjectId})));
  saveLocal(); closeModal(); toast("نُسخ الجدول");
}

/* --- صفحة المواد والأساتذة --- */
function vStaff(){
  const nT=sid=>S.teachers.filter(t=>t.subjectId===sid).length;
  return `${flashHTML()}<div class="card"><h2>المواد (${S.subjects.length})</h2>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${S.subjects.map(x=>`<span class="chip">${esc(x.name)} <span class="muted">(${nT(x.id)} أستاذ)</span> <button onclick="askDelSubject('${x.id}')" title="حذف">✕</button></span>`).join("")}</div>
    <div class="row" style="align-items:end"><label class="f" style="margin:0">مادة جديدة<input id="nSubj" placeholder="مثال: الهندسة الكهربائية"></label>
    <button class="btn" style="flex:0 0 auto" onclick="addSubject()">+ مادة</button></div></div>
  <div class="card"><h2>الأساتذة (${S.teachers.length})</h2>
    <div class="row" style="align-items:end">
      <label class="f" style="margin:0">اسم الأستاذ(ة)<input id="nTeach" placeholder="مثال: محمد بوعلام"></label>
      <label class="f" style="margin:0">المادة<select id="nTeachSubj">${S.subjects.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></label>
      <button class="btn" style="flex:0 0 auto" onclick="addTeacher()">+ أستاذ</button>
    </div>
    ${S.teachers.length?`<table style="margin-top:10px"><tr><th>الأستاذ</th><th>المادة</th><th>الأقسام</th><th></th></tr>
      ${S.teachers.slice().sort((a,b)=>a.name.localeCompare(b.name,"ar")).map(t=>{ const cl=S.classes.filter(c=>Object.values(c.assign||{}).includes(t.id)).map(c=>c.name);
        return `<tr><td>${esc(t.name)}</td><td><select onchange="put('teachers',{...teach('${t.id}'),subjectId:this.value})">${S.subjects.map(x=>`<option value="${x.id}" ${x.id===t.subjectId?"selected":""}>${esc(x.name)}</option>`).join("")}</select></td>
        <td class="muted">${cl.length?esc(cl.join("، ")):"—"}</td><td><button class="btn ghost sm" onclick="askDelTeacher('${t.id}')">حذف</button></td></tr>`; }).join("")}</table>`
    :`<p class="muted">لم يُضف أي أستاذ بعد.</p>`}</div>`;
}
function addSubject(){ const n=document.getElementById("nSubj").value.trim(); if(!n) return; if(S.subjects.some(x=>x.name===n)) return toast("المادة موجودة",true); put("subjects",{id:uid(),name:n}); }
function addTeacher(){ const n=document.getElementById("nTeach").value.trim(); if(!n) return toast("أدخل اسم الأستاذ",true); put("teachers",{id:uid(),name:n,subjectId:document.getElementById("nTeachSubj").value}); toast("أُضيف "+n); }
function askDelSubject(id){
  const n=S.timetable.filter(x=>x.subjectId===id).length;
  confirmBox(`حذف مادة «${esc(subj(id).name)}»؟`,n?`ستُحذف ${n} حصة من جداول التوقيت.`:"",()=>{ S.timetable=S.timetable.filter(x=>x.subjectId!==id); S.subjects=S.subjects.filter(x=>x.id!==id); saveLocal(); render(); });
}
function askDelTeacher(id){
  confirmBox(`حذف الأستاذ(ة) «${esc(teach(id).name)}»؟`,"",()=>{ S.classes.forEach(c=>{ if(c.assign) Object.keys(c.assign).forEach(k=>{ if(c.assign[k]===id) delete c.assign[k]; }); }); S.teachers=S.teachers.filter(x=>x.id!==id); saveLocal(); render(); });
}
function confirmBox(title,msg,fn){
  document.getElementById("modal").innerHTML=`<div class="overlay"><div class="dialog"><h2 style="margin-top:0">${title}</h2>${msg?`<p>${msg}</p>`:""}
    <div class="row"><button class="btn red" id="cfOk">حذف</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div></div></div>`;
  document.getElementById("cfOk").onclick=()=>{ closeModal(); fn(); };
}

/* --- إعدادات الفترات وأيام الدراسة --- */
function periodsCard(){
  const days=S.cfg.days||[];
  return `<div class="card"><h2>السنة الدراسية والتوقيت</h2>
    <label class="f">السنة الدراسية<input value="${esc(S.cfg.schoolYear||"")}" onchange="saveCfg({...S.cfg,schoolYear:this.value.trim()})" style="direction:ltr;max-width:200px"></label>
    <div class="f">أيام الدراسة</div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px">${DAY_ORDER.map(d=>`<label class="switch" style="margin:0"><input type="checkbox" ${days.includes(d)?"checked":""} onchange="toggleDay(${d},this.checked)"> ${DAY_NAMES[d]}</label>`).join("")}</div>
    <div class="f">فترات الحصص</div>
    <table><tr><th>#</th><th>من</th><th>إلى</th><th></th></tr>
    ${sortedPeriods().map((p,i)=>`<tr><td>${i+1}</td><td><input type="time" value="${p.from}" onchange="setPeriod('${p.id}','from',this.value)"></td><td><input type="time" value="${p.to}" onchange="setPeriod('${p.id}','to',this.value)"></td>
      <td><button class="btn ghost sm" onclick="delPeriod('${p.id}')">حذف</button></td></tr>`).join("")}</table>
    <button class="btn ghost" style="margin-top:8px" onclick="addPeriod()">+ فترة</button></div>`;
}
function toggleDay(d,on){ const s=new Set(S.cfg.days||[]); on?s.add(d):s.delete(d); saveCfg({...S.cfg,days:[...s]}); }
function setPeriod(id,k,v){ if(!v) return; saveCfg({...S.cfg,periods:(S.cfg.periods||[]).map(p=>p.id===id?{...p,[k]:v}:p)}); }
function addPeriod(){ const ps=sortedPeriods(); const last=ps[ps.length-1]; const from=last?last.to:"08:00"; saveCfg({...S.cfg,periods:[...(S.cfg.periods||[]),{id:uid(),from,to:addHM(from,60)}]}); }
function delPeriod(id){
  const n=S.timetable.filter(x=>x.periodId===id).length;
  confirmBox("حذف هذه الفترة؟",n?`ستُحذف ${n} حصة من جداول التوقيت.`:"",()=>{ S.timetable=S.timetable.filter(x=>x.periodId!==id); saveCfg({...S.cfg,periods:(S.cfg.periods||[]).filter(p=>p.id!==id)}); });
}

/* --- Demo data --- */
async function seedDemo(){
  const id=uid(); const yy=String(new Date().getFullYear()).slice(2);
  const names=["عبد الله سلطان","سلمى محمدي","أمين بن علي","ياسمين قاسمي","محمد الأمين زروقي","إيمان بوزيد","يوسف حمادي","رانية بلقاسم","أيوب مرابط","هاجر سعيدي","إسحاق بن يحيى","مريم عيساوي","وليد شريف","نور الهدى خالدي","أنس بوعزة","آية فرحات","رياض منصوري","خديجة بن سالم","زكرياء حداد","سارة لعمامري","إلياس بوشامة","شيماء قويدر","عماد طالبي","لينة بن عمر","حمزة رحماني"];
  const cl={id,level:"2 ثانوي",name:"2 ثانوي — علوم تجريبية 1"};
  const base=parseInt(nextCode().slice(2),10);
  const studs=names.map((n,i)=>({id:uid(),code:yy+String(base+i).padStart(4,"0"),name:n,parent:"ولي "+n.split(" ").slice(-1)[0],phone:"",classId:id}));
  // أساتذة وجدول توقيت تجريبي
  const sid=n=>(S.subjects.find(x=>x.name===n)||{}).id;
  const tnames=[["محمد بوعلام","الرياضيات"],["فاطمة الزهراء بن عيسى","اللغة العربية"],["كريم سعدي","العلوم الفيزيائية"],["نادية حمدي","العلوم الطبيعية"],["سمير بلعيد","اللغة الفرنسية"],["ليلى مسعودي","اللغة الإنجليزية"],["عبد القادر زيتوني","التاريخ والجغرافيا"],["رشيد عمراني","التربية الإسلامية"]];
  const tch=tnames.filter(t=>sid(t[1])).map(([n,sb])=>({id:uid(),name:n,subjectId:sid(sb)}));
  cl.assign={}; tch.forEach(t=>cl.assign[t.subjectId]=t.id);
  const plan=["الرياضيات","العلوم الفيزيائية","اللغة العربية","العلوم الطبيعية","اللغة الفرنسية","الرياضيات","اللغة الإنجليزية","التاريخ والجغرافيا","التربية الإسلامية"];
  const tt=[]; let k=0;
  schoolDays().forEach(d=>sortedPeriods().forEach(p=>{ const s=sid(plan[k++%plan.length]); if(s) tt.push({id:uid(),classId:id,day:d,periodId:p.id,subjectId:s}); }));
  S.teachers.push(...tch); S.timetable.push(...tt);
  S.classes.push(cl); S.students.push(...studs); saveLocal();
  selClass=id; lsSet("ghiyab_selClass",id); toast("أُضيف قسم تجريبي بـ 25 تلميذاً وأساتذته وجدول توقيته");
}

/* ============ Boot ============ */
window.addEventListener("resize",()=>{ if(view==="report"&&!zoom) render(); });
render();
if(IS_APP){ try{ const p=smsPlugin(); p&&p.keepAwake&&p.keepAwake(); }catch(e){} }
let lastAct=-1;
setInterval(()=>{
  const n=needAction().length;
  if(lastAct>=0&&n>lastAct){ try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){} toast("🔔 إشعارات تحتاج إجراء — افتح «الإشعارات»"); }
  lastAct=n; updateBadge();
  if(view==="notifs") document.querySelectorAll("[data-cd]").forEach(el=>{ el.textContent=cdText(el.dataset.cd); });
},1000);
// صفحة تسجيل الغياب تتبع الوقت: تحديث الحصص الجارية كل 30 ثانية
setInterval(()=>{ if(view!=="session") return; const ae=document.activeElement;
  if(ae&&["INPUT","TEXTAREA","SELECT"].includes(ae.tagName)&&ae.id!=="scanInput") return; if(document.getElementById("modal").innerHTML) return; render(); },30000);
// إعادة رسم صفحة الإشعارات عند تغيّر الحالات
let lastSig="";
setInterval(()=>{ if(view!=="notifs") return; const ae=document.activeElement; if(ae&&["INPUT","TEXTAREA","SELECT"].includes(ae.tagName)) return;
  const sig=S.absences.map(a=>a.id+a.status+(a.notifyAt<=Date.now())).join(); if(sig!==lastSig){ lastSig=sig; render(); } },2000);
</script>
