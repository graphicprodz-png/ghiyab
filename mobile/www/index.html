<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>غياب — إعلام الأولياء بغياب التلاميذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="capacitor.js"></script>
<style>
:root{
  --bg:#f4f6f5;--card:#fff;--ink:#14231c;--muted:#5d6e66;--line:#dfe6e2;
  --brand:#0f6b4f;--brand-2:#e8f3ee;--red:#c0392b;--red-2:#fbeceA;--amber:#b7791f;--amber-2:#fdf3e1;
  --wa:#1f9d55;--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
header .sub{font-size:12.5px;opacity:.85;margin-top:2px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#fff;opacity:.75;padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;font-weight:600}
nav button.on{opacity:1;border-color:#fff}
nav .badge{background:#fff;color:var(--brand);border-radius:99px;padding:0 7px;font-size:12px;margin-inline-start:4px}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
label.f{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:3px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;display:inline-flex;align-items:center;gap:6px;justify-content:center;text-decoration:none}
.btn.ghost{background:var(--brand-2);color:var(--brand)}
.btn.red{background:var(--red)}
.btn.wa{background:var(--wa)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted);font-size:13px}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stu{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:#fff;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:2px;transition:.12s}
.stu .n{font-weight:700}
.stu .c{font-size:12px;color:var(--muted);direction:ltr;text-align:end}
.stu.abs{border-color:var(--red);background:var(--red-2)}
.stu.abs .n{color:var(--red)}
.stu.locked{cursor:default}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px}
.tag.red{background:var(--red-2);color:var(--red)}
.tag.amb{background:var(--amber-2);color:var(--amber)}
.tag.ok{background:var(--brand-2);color:var(--brand)}
.scan{display:flex;gap:8px;align-items:center;background:var(--brand-2);border-radius:12px;padding:10px;margin-bottom:10px;flex-wrap:wrap}
.scan input{flex:1 1 180px;direction:ltr;text-align:center;font-weight:700;letter-spacing:2px}
.flash{padding:8px 12px;border-radius:10px;margin-bottom:10px;font-weight:600;font-size:14px}
.flash.ok{background:var(--brand-2);color:var(--brand)}
.flash.err{background:var(--red-2);color:var(--red)}
.notif{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}
.notif .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.notif .msg{background:#f2f7f4;border-radius:10px;padding:9px 11px;font-size:13.5px;margin:8px 0;white-space:pre-wrap;line-height:1.7}
.notif .act{display:flex;gap:6px;flex-wrap:wrap}
.cd{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.ltr{direction:ltr;text-align:end}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.label{border:1px dashed #9aa9a2;border-radius:8px;padding:8px;background:#fff;text-align:center;break-inside:avoid}
.label .ln{font-weight:700;font-size:14px}
.label .lc{font-size:11.5px;color:var(--muted)}
.label svg{width:100%;height:54px;display:block;margin:4px 0 0}
.label .code{direction:ltr;font-weight:700;letter-spacing:3px;font-size:13px}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;background:rgba(255,255,255,.18);border-radius:99px;padding:2px 9px;margin-top:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#ffd166}
.dot.live{background:#7CFFB2}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.dialog{background:#fff;border-radius:16px;padding:16px;max-width:420px;width:100%}
.hide{display:none!important}
.banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.banner.ok{background:var(--brand-2);color:var(--brand)}
.banner.amb{background:var(--amber-2);color:var(--amber)}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:10px}
.switch input{width:22px;height:22px;accent-color:var(--brand)}
@media print{header,.noprint{display:none!important}main{padding:0}.card{border:0}}
</style>
</head>
<body>
<header>
  <h1>📋 <span id="schoolTitle">غياب</span></h1>
  <div class="sub">تسجيل غياب التلاميذ وإعلام الأولياء آلياً عبر SMS</div>
    <nav id="nav">
    <button data-v="session" class="on">تسجيل الغياب</button>
    <button data-v="notifs">الإشعارات <span class="badge hide" id="dueBadge">0</span></button>
    <button data-v="students">الأقسام والتلاميذ</button>
    <button data-v="labels">ملصقات الكودبار</button>
    <button data-v="settings">الإعدادات</button>
  </nav>
</header>
<main id="main"></main>
<div id="modal"></div>

<script>
/* ============ Data layer: shared db when available, otherwise this browser ============ */
const DEFAULT_CFG={
  school:"ثانوية النموذجية",
  autoSms:true,
  delayMin:15,
  cc:"213",
  template:"{المؤسسة}: ابنكم {الاسم} ({القسم}) غائب عن حصة {المادة} يوم {التاريخ} من {من} إلى {إلى}."
};
const S={classes:[],students:[],absences:[],cfg:{...DEFAULT_CFG}};
const DB=null;
const LS_KEY="ghiyab_v1";
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function saveLocal(){ if(!DB) lsSet(LS_KEY,{classes:S.classes,students:S.students,absences:S.absences,cfg:S.cfg}); }
(function loadLocal(){const d=lsGet(LS_KEY); if(d){Object.assign(S,d); S.cfg={...DEFAULT_CFG,...(d.cfg||{})};}})();

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const strip=o=>{const c={...o};delete c.id;return c};

async function put(col,obj){
  if(DB){ try{ await DB.collection(col).doc(obj.id).set(strip(obj)); }catch(e){ toast("تعذّر الحفظ: "+(e.message||e.code),true) } return; }
  const arr=S[col]; const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0) arr[i]=obj; else arr.push(obj);
  saveLocal(); render();
}
async function del(col,id){
  if(DB){ try{ await DB.collection(col).doc(id).delete(); }catch(e){ toast("تعذّر الحذف",true) } return; }
  S[col]=S[col].filter(x=>x.id!==id); saveLocal(); render();
}
async function saveCfg(cfg){
  S.cfg=cfg;
  if(DB){ try{ await DB.doc("config/main").set(cfg);}catch(e){toast("تعذّر حفظ الإعدادات",true)} }
  else { saveLocal(); }
  render();
}

/* ============ Native (APK) ============ */
const IS_APP=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
let _sms=null;
function smsPlugin(){
  if(!IS_APP) return null;
  if(_sms) return _sms;
  const C=window.Capacitor;
  _sms=(typeof C.registerPlugin==="function"?C.registerPlugin("SmsSender"):null)||(C.Plugins&&C.Plugins.SmsSender)||null;
  return _sms;
}
const autoOn=()=>IS_APP&&!!S.cfg.autoSms&&!!smsPlugin();

/* ============ Helpers ============ */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const addHM=(hm,min)=>{const[h,m]=hm.split(":").map(Number);const t=h*60+m+min;return String(Math.floor(t/60)%24).padStart(2,"0")+":"+String(t%60).padStart(2,"0")};
const fmtDate=s=>{try{const[y,m,d]=s.split("-");return d+"/"+m+"/"+y}catch(e){return s}};
const cls=id=>S.classes.find(c=>c.id===id);
const stuByCode=code=>S.students.find(s=>s.code===String(code).trim());
function intlPhone(p){
  let d=String(p||"").replace(/[^\d+]/g,"");
  if(d.startsWith("+")) return d.slice(1);
  if(d.startsWith("00")) return d.slice(2);
  if(d.startsWith("0")) return (S.cfg.cc||"213")+d.slice(1);
  return d;
}
function nextCode(){
  const yy=String(new Date().getFullYear()).slice(2);
  let max=0; S.students.forEach(s=>{ if(s.code&&s.code.startsWith(yy)){const n=parseInt(s.code.slice(2),10); if(n>max) max=n;} });
  return yy+String(max+1).padStart(4,"0");
}
function message(a){
  const st=S.students.find(s=>s.id===a.studentId)||{name:a.studentName,code:a.code};
  const c=cls(a.classId);
  return (S.cfg.template||"")
    .replaceAll("{الاسم}",st.name||a.studentName||"")
    .replaceAll("{الرقم}",st.code||a.code||"")
    .replaceAll("{القسم}",c?c.name:(a.className||""))
    .replaceAll("{المادة}",a.subject||"")
    .replaceAll("{الأستاذ}",a.teacher||"")
    .replaceAll("{التاريخ}",fmtDate(a.date))
    .replaceAll("{من}",a.from||"")
    .replaceAll("{إلى}",a.to||"")
    .replaceAll("{المؤسسة}",S.cfg.school||"");
}

/* ============ Code 39 barcode (SVG) ============ */
const C39={"0":"nnnwwnwnn","1":"wnnwnnnnw","2":"nnwwnnnnw","3":"wnwwnnnnn","4":"nnnwwnnnw","5":"wnnwwnnnn","6":"nnwwwnnnn","7":"nnnwnnwnw","8":"wnnwnnwnn","9":"nnwwnnwnn","*":"nwnnwnwnn"};
function barcodeSVG(code){
  const chars=("*"+code+"*").split(""); let x=10; const N=2,W=5,H=60; let rects="";
  chars.forEach((ch,ci)=>{
    const p=C39[ch]; if(!p) return;
    for(let i=0;i<9;i++){ const w=p[i]==="w"?W:N; if(i%2===0) rects+=`<rect x="${x}" y="0" width="${w}" height="${H}"/>`; x+=w; }
    if(ci<chars.length-1) x+=N;
  });
  return `<svg viewBox="0 0 ${x+10} ${H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

/* ============ UI state ============ */
let view=(location.hash||"").slice(1)||"session";
if(!["session","notifs","students","labels","settings"].includes(view)) view="session";
let session=lsGet("ghiyab_session");           // current class session on this device
let selClass=lsGet("ghiyab_selClass")||null;   // selected class in students view
let labelClass=null, notifDate=todayStr(), flashMsg=null;

function toast(msg,err){ flashMsg={msg,err}; render(); setTimeout(()=>{ if(flashMsg&&flashMsg.msg===msg){flashMsg=null;render()} },3500); }
function flashHTML(){ return flashMsg?`<div class="flash ${flashMsg.err?"err":"ok"}">${esc(flashMsg.msg)}</div>`:"" }

document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]"); if(!b) return;
  view=b.dataset.v; flashMsg=null; try{history.replaceState(null,"","#"+view)}catch(_){ } render(); window.scrollTo(0,0);
});
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1); if(v&&v!==view){view=v;render()}});

/* ============ Views ============ */
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  document.getElementById("schoolTitle").textContent=S.cfg.school||"غياب";
  updateBadge();
  const m=document.getElementById("main");
  const active=document.activeElement&&document.activeElement.id;
  setTimeout(()=>{ if(view==="settings") smsCount(); },0);
  m.innerHTML=({session:vSession,notifs:vNotifs,students:vStudents,labels:vLabels,settings:vSettings}[view]||vSession)();
  if(active==="scanInput"){ const s=document.getElementById("scanInput"); if(s) s.focus(); }
}

function needAction(){ const t=Date.now(); return S.absences.filter(a=>a.status==="failed"||(!autoOn()&&a.status==="waiting"&&a.notifyAt<=t)); }
function updateBadge(){ const n=needAction().length; const bd=document.getElementById("dueBadge"); bd.textContent=n; bd.classList.toggle("hide",!n); }
function emptyData(){
  return `<div class="card empty">
    <div style="font-size:34px">🏫</div>
    <p>لا توجد أقسام ولا تلاميذ بعد.</p>
    <div class="row" style="justify-content:center;max-width:420px;margin:auto">
      <button class="btn" onclick="seedDemo()">إضافة بيانات تجريبية (قسم 2 ثانوية، 25 تلميذاً)</button>
      <button class="btn ghost" onclick="view='students';render()">إضافة الأقسام يدوياً</button>
    </div></div>`;
}

/* --- Session / attendance --- */
function vSession(){
  if(!S.classes.length) return emptyData();
  if(!session){
    const t=nowHM();
    return `<div class="card"><h2>بدء حصة جديدة</h2>
      <label class="f">القسم<select id="sClass">${S.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label>
      <div class="row">
        <label class="f">المادة<input id="sSubject" placeholder="مثال: الرياضيات" list="subjects"></label>
        <label class="f">الأستاذ(ة)<input id="sTeacher" placeholder="مثال: محمد بوعلام"></label>
      </div>
      <datalist id="subjects">${["الرياضيات","اللغة العربية","الفيزياء","العلوم الطبيعية","اللغة الفرنسية","اللغة الإنجليزية","التاريخ والجغرافيا","الفلسفة","التربية الإسلامية","الإعلام الآلي"].map(s=>`<option value="${s}">`).join("")}</datalist>
      <div class="row">
        <label class="f">التاريخ<input type="date" id="sDate" value="${todayStr()}"></label>
        <label class="f">من الساعة<input type="time" id="sFrom" value="${t}"></label>
        <label class="f">إلى الساعة<input type="time" id="sTo" value="${addHM(t,60)}"></label>
      </div>
      <button class="btn" onclick="startSession()" style="width:100%;margin-top:4px">بدء تسجيل الغياب</button>
    </div>
    ${recentSessions()}`;
  }
  const c=cls(session.classId);
  const list=S.students.filter(s=>s.classId===session.classId).sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  const absMap={}; S.absences.filter(a=>a.sessionId===session.id).forEach(a=>absMap[a.studentId]=a);
  const nAbs=Object.keys(absMap).length;
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap">
      <div><h2 style="margin:0">${esc(session.subject)} — ${esc(c?c.name:"")}</h2>
      <div class="muted">الأستاذ(ة) ${esc(session.teacher)} · ${fmtDate(session.date)} · من ${session.from} إلى ${session.to}</div></div>
      <button class="btn ghost sm" onclick="endSession()">إنهاء الحصة</button>
    </div></div>
    <div class="stats">
      <div class="stat"><b>${list.length}</b><span>عدد التلاميذ</span></div>
      <div class="stat"><b style="color:var(--brand)">${list.length-nAbs}</b><span>حاضر</span></div>
      <div class="stat"><b style="color:var(--red)">${nAbs}</b><span>غائب</span></div>
    </div>
    <div class="scan">
      <span>🔎</span>
      <input id="scanInput" inputmode="numeric" placeholder="امسح الكودبار أو اكتب رقم التلميذ" onkeydown="if(event.key==='Enter'){scanCode(this.value);this.value=''}">
      <label class="btn ghost sm" style="flex:0 0 auto">📷 صورة<input type="file" accept="image/*" capture="environment" class="hide" onchange="scanImage(this)"></label>
    </div>
    ${flashHTML()}
    <p class="muted" style="margin:0 0 8px">اضغط على اسم التلميذ الغائب لتسجيل غيابه، أو اضغط مرة أخرى لإلغائه (قبل إرسال الإشعار).</p>
    ${list.length?`<div class="grid">${list.map(s=>{const a=absMap[s.id];const sent=a&&a.status==="sent";
      return `<button class="stu ${a?"abs":""} ${sent?"locked":""}" onclick="toggleAbs('${s.id}')">
        <span class="n">${esc(s.name)}</span><span class="c">${esc(s.code)}</span>
        ${a?`<span class="tag ${sent?"ok":"red"}">${sent?"غائب · أُعلم الولي":"غائب"}</span>`:""}
      </button>`}).join("")}</div>`:`<div class="empty">لا يوجد تلاميذ في هذا القسم.</div>`}`;
}
function recentSessions(){
  const seen={}; const rows=[];
  S.absences.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(a=>{
    if(!seen[a.sessionId]){seen[a.sessionId]={a,n:0};rows.push(seen[a.sessionId])} seen[a.sessionId].n++;
  });
  if(!rows.length) return "";
  return `<div class="card"><h2>آخر الحصص المسجّلة</h2><table><tr><th>الحصة</th><th>القسم</th><th>التاريخ</th><th>الغيابات</th></tr>
    ${rows.slice(0,8).map(r=>`<tr><td>${esc(r.a.subject)}</td><td>${esc((cls(r.a.classId)||{}).name||r.a.className||"")}</td><td>${fmtDate(r.a.date)} ${r.a.from}</td><td><span class="tag red">${r.n}</span></td></tr>`).join("")}
  </table></div>`;
}
function startSession(){
  const g=id=>document.getElementById(id).value.trim();
  if(!g("sSubject")||!g("sTeacher")) return toast("أدخل المادة واسم الأستاذ",true);
  session={id:uid(),classId:g("sClass"),subject:g("sSubject"),teacher:g("sTeacher"),date:g("sDate"),from:g("sFrom"),to:g("sTo")};
  lsSet("ghiyab_session",session); flashMsg=null; render();
  setTimeout(()=>{const s=document.getElementById("scanInput"); if(s) s.focus()},50);
}
function endSession(){ session=null; lsSet("ghiyab_session",null); flashMsg=null; render(); }
function toggleAbs(studentId){
  const id=session.id+"_"+studentId;
  const ex=S.absences.find(a=>a.id===id);
  if(ex){ if(ex.status==="sent") return toast("أُرسل الإشعار للولي، لا يمكن إلغاء هذا الغياب",true); del("absences",id); return; }
  const st=S.students.find(s=>s.id===studentId); const c=cls(session.classId);
  const now=Date.now();
  put("absences",{id,sessionId:session.id,studentId,studentName:st.name,code:st.code,classId:session.classId,className:c?c.name:"",
    subject:session.subject,teacher:session.teacher,date:session.date,from:session.from,to:session.to,
    createdAt:now,notifyAt:now+(Number(S.cfg.delayMin)||0)*60000,status:"waiting"});
}
function scanCode(v){
  v=String(v||"").replace(/\*/g,"").trim(); if(!v) return;
  const st=stuByCode(v);
  if(!st) return toast("الرقم "+v+" غير موجود",true);
  if(st.classId!==session.classId) return toast(st.name+" ليس من هذا القسم",true);
  const id=session.id+"_"+st.id;
  if(S.absences.find(a=>a.id===id)) return toast(st.name+" مسجّل غائباً من قبل",false);
  toggleAbs(st.id); toast("✓ سُجّل غياب "+st.name);
}
async function scanImage(inp){
  const f=inp.files&&inp.files[0]; inp.value=""; if(!f) return;
  if(!("BarcodeDetector" in window)) return toast("هذا المتصفح لا يقرأ الكودبار من الصور. استعمل قارئ كودبار أو اكتب الرقم.",true);
  try{
    const bmp=await createImageBitmap(f);
    const det=new BarcodeDetector({formats:["code_39","code_128","qr_code"]});
    const r=await det.detect(bmp);
    if(!r.length) return toast("لم يُعثر على كودبار في الصورة",true);
    r.forEach(x=>scanCode(x.rawValue));
  }catch(e){ toast("تعذّرت قراءة الصورة",true) }
}

/* --- Automatic SMS from the device SIM --- */
let sending=false;
async function autoSendTick(){
  if(sending||!autoOn()) return;
  const due=S.absences.filter(a=>a.status==="waiting"&&a.notifyAt<=Date.now()&&(a.attempts||0)<3);
  if(!due.length) return;
  sending=true;
  try{
    for(const a of due){
      const st=S.students.find(s=>s.id===a.studentId)||{};
      const phone=intlPhone(st.phone);
      if(!phone){ await put("absences",{...a,status:"failed",lastError:"لا يوجد رقم هاتف للولي"}); continue; }
      try{
        await smsPlugin().send({phone:"+"+phone,message:message(a)});
        await put("absences",{...a,status:"sent",channel:"sms",sentAt:Date.now(),attempts:(a.attempts||0)+1,lastError:""});
      }catch(e){
        const n=(a.attempts||0)+1;
        await put("absences",{...a,attempts:n,status:n>=3?"failed":"waiting",lastError:String((e&&e.message)||e).slice(0,300),notifyAt:Date.now()+120000});
      }
    }
  }finally{ sending=false; }
}
setInterval(()=>autoSendTick().catch(()=>{}),5000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) autoSendTick().catch(()=>{}); });

function showBackup(){
  const t=backupText();
  document.getElementById("modal").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="dialog">
    <h2 style="margin-top:0">نسخة احتياطية</h2>
    <p class="muted">انسخ النص واحفظه، مثلاً أرسله لنفسك عبر واتساب أو البريد.</p>
    <textarea id="bkTxt" readonly style="width:100%;min-height:160px;direction:ltr;font-size:11px">${esc(t)}</textarea>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="copyBackup()">نسخ</button>
    ${IS_APP?"":`<a class="btn ghost" download="ghiyab-${todayStr()}.json" href="data:application/json;charset=utf-8,${encodeURIComponent(t)}">تنزيل ملف</a>`}
    <button class="btn ghost" onclick="closeModal()">إغلاق</button></div></div></div>`;
}
async function copyBackup(){ const el=document.getElementById("bkTxt"); try{await navigator.clipboard.writeText(el.value); toast("نُسخت النسخة الاحتياطية")}catch(e){ el.select(); try{document.execCommand("copy");toast("نُسخت النسخة الاحتياطية")}catch(_){toast("انسخ النص يدوياً",true)} } }
function applyBackup(txt){
  let d; try{ d=JSON.parse(txt) }catch(e){ return toast("الملف غير صالح",true) }
  if(!d||d.app!=="ghiyab"||!Array.isArray(d.students)) return toast("هذه ليست نسخة احتياطية لتطبيق غياب",true);
  document.getElementById("modal").innerHTML=`<div class="overlay"><div class="dialog"><h2 style="margin-top:0">استرجاع النسخة؟</h2>
    <p>${d.classes.length} قسم، ${d.students.length} تلميذ، ${d.absences.length} غياب.<br>ستُستبدل كل البيانات الحالية على هذا الجهاز.</p>
    <div class="row"><button class="btn red" id="okRestore">استرجاع</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div></div></div>`;
  document.getElementById("okRestore").onclick=()=>{ S.classes=d.classes||[]; S.students=d.students||[]; S.absences=d.absences||[]; S.cfg={...DEFAULT_CFG,...(d.cfg||{})}; saveLocal(); closeModal(); toast("استُرجعت البيانات"); };
}
function restoreFile(inp){ const f=inp.files&&inp.files[0]; inp.value=""; if(!f) return; const r=new FileReader(); r.onload=()=>applyBackup(String(r.result)); r.readAsText(f); }
function restorePaste(){
  document.getElementById("modal").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="dialog">
    <h2 style="margin-top:0">الصق النسخة الاحتياطية</h2><textarea id="pasteTxt" style="width:100%;min-height:160px;direction:ltr;font-size:11px"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" onclick="applyBackup(document.getElementById('pasteTxt').value)">متابعة</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div></div></div>`;
}

/* --- Demo data --- */
async function seedDemo(){
  const id=uid(); const yy=String(new Date().getFullYear()).slice(2);
  const names=["عبد الله سلطان","سلمى محمدي","أمين بن علي","ياسمين قاسمي","محمد الأمين زروقي","إيمان بوزيد","يوسف حمادي","رانية بلقاسم","أيوب مرابط","هاجر سعيدي","إسحاق بن يحيى","مريم عيساوي","وليد شريف","نور الهدى خالدي","أنس بوعزة","آية فرحات","رياض منصوري","خديجة بن سالم","زكرياء حداد","سارة لعمامري","إلياس بوشامة","شيماء قويدر","عماد طالبي","لينة بن عمر","حمزة رحماني"];
  const cl={id,level:"2 ثانوي",name:"2 ثانوي — علوم تجريبية 1"};
  const base=parseInt(nextCode().slice(2),10);
  const studs=names.map((n,i)=>({id:uid(),code:yy+String(base+i).padStart(4,"0"),name:n,parent:"ولي "+n.split(" ").slice(-1)[0],phone:"",classId:id}));
  if(DB){ await put("classes",cl); for(const s of studs) await put("students",s); }
  else { S.classes.push(cl); S.students.push(...studs); saveLocal(); }
  selClass=id; lsSet("ghiyab_selClass",id); toast("أُضيف قسم تجريبي بـ 25 تلميذاً");
}

/* ============ Boot ============ */
render();
if(IS_APP){ try{ const p=smsPlugin(); p&&p.keepAwake&&p.keepAwake(); }catch(e){} }
let lastAct=-1;
setInterval(()=>{
  const n=needAction().length;
  if(lastAct>=0&&n>lastAct){ try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){} toast("🔔 إشعارات تحتاج إجراء — افتح «الإشعارات»"); }
  lastAct=n; updateBadge();
  if(view==="notifs") document.querySelectorAll("[data-cd]").forEach(el=>{ el.textContent=cdText(el.dataset.cd); });
},1000);
// إعادة رسم صفحة الإشعارات عند تغيّر الحالات
let lastSig="";
setInterval(()=>{ if(view!=="notifs") return; const ae=document.activeElement; if(ae&&["INPUT","TEXTAREA","SELECT"].includes(ae.tagName)) return;
  const sig=S.absences.map(a=>a.id+a.status+(a.notifyAt<=Date.now())).join(); if(sig!==lastSig){ lastSig=sig; render(); } },2000);
</script>
