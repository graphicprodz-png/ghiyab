<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f6b4f">
<title>غياب — إعلام الأولياء بغياب التلاميذ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="hide">
  <form class="card loginbox" onsubmit="event.preventDefault();doLogin()">
    <div style="font-size:40px;text-align:center">📋</div>
    <h1 style="text-align:center;margin:4px 0 14px;font-size:22px">غياب</h1>
    <label class="f">اسم المستخدم<input id="lUser" autocomplete="username" style="direction:ltr" required></label>
    <label class="f">كلمة المرور<input id="lPass" type="password" autocomplete="current-password" style="direction:ltr" required></label>
    <div id="lErr" class="flash err hide"></div>
    <button class="btn" style="width:100%">دخول</button>
  </form>
</div>

<div id="app" class="hide">
<header>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
    <h1>📋 <span id="schoolTitle">غياب</span></h1>
    <button class="btn ghost sm noprint" onclick="doLogout()" id="meBtn"></button>
  </div>
  <div class="sub">تسجيل غياب التلاميذ وإعلام الأولياء آلياً عبر واتساب أو SMS</div>
  <nav id="nav" class="noprint"></nav>
</header>
<main id="main"></main>
</div>
<div id="modal"></div>
<script src="/app.js"></script>
</body>
</html>
